<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasr Embed Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h1 {
            margin-top: 0;
            font-weight: 800;
            color: #0f172a;
        }

        p {
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .embed-wrapper {
            background-color: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 24px;
            margin-top: 32px;
            height: 500px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>My Awesome SaaS Journey</h1>
        <p>Welcome to my personal blog where I share updates about my latest product! Building in public is hard but
            rewarding.</p>

        <p>I've recently set a new goal for this year. You can track my progress live down below, powered by Chasr!</p>

        <!-- The Embed Snippet -->
        <div class="embed-wrapper">
            <!-- IMPORTANT: Replace the data-goal with an actual slug from your dashboard! -->
            <!-- e.g. if the url is /goals/my-revenue-goal, the slug is my-revenue-goal -->
            <script src="http://localhost:3000/embed.js" data-goal="chasr-94p4" async></script>
        </div>
    </div>
</body>

</html>
